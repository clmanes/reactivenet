[authorRole]
other = "Software engineer and educator · educational-projects coordinator at IISS «E. Majorana», Brindisi"

[authorBio]
other = "Cosimo has spent his career between software and teaching, bringing AI into classrooms and real projects — safely and privacy-first. ReactiveNET comes from a simple belief: everyone should be able to build the tools they need and truly own them, data included. No server, no account, nothing to surrender."

