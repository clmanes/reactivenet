[appCardEyebrow]
other = "Catalogue app"

[appOpen]
other = "Open in the platform"

[appOpenNote]
other = "The app travels inside the link: it opens in your browser and stays there. No account, nothing to install, and none of your data passes through a server."

[appSource]
other = "See the source"

[appCtaTitle]
other = "Yours to change"

[appCtaSub]
other = "An app is a Markdown document: open it, edit it by hand, or ask the assistant to change it for you. Whatever you add stays on your device."

[homeLocalTitle]
other = "You do not need a huge model"

[homeLocalLead]
other = "A ReactiveNET app is a short document, not a program: a small model — the kind that runs on your own computer — is enough to write it. No key to buy, nothing leaving the machine, no metered bill."

[localSmallTitle]
other = "Small models, not enormous ones"

[localSmallText]
other = "The language is made of directives, and the assistant learns them from the MCP server instead of inventing them: a model of a few billion parameters builds a working app. Large models are for the harder apps, not for starting out."

[localDeviceTitle]
other = "On your computer, not in the cloud"

[localDeviceText]
other = "With Ollama the model runs locally: the request, the conversation and the app's document stay on your machine. It is the only setup where there is no key to keep safe and nothing to defend against."

[localFreeTitle]
other = "At no cost"

[localFreeText]
other = "The platform is free and local models are free: no subscription, no per-token billing, no monthly cap. You can use a remote provider if you prefer one, but that is a choice, not a requirement."

[appDownload]
other = "Download the document"

[appImportNote]
other = "This app is larger than an address can carry: download it as a Markdown document and import it from the gallery. It is the same app, with one step more."

[sectionEmpty]
other = "This section has no published apps yet: the ones that belong here are being prepared. In the meantime, an app you need is one sentence away — the assistant writes it, which is how these come about too."

