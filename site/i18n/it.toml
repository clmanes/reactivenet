[authorRole]
other = "Sviluppatore software e docente · coordinatore di progetti educativi all'IISS «E. Majorana» di Brindisi"

[authorBio]
other = "Cosimo lavora da sempre tra software e insegnamento, portando l'AI in classe e nei progetti reali in modo sicuro e rispettoso della privacy. ReactiveNET nasce da una convinzione semplice: chiunque deve poter costruire gli strumenti che gli servono e restarne davvero proprietario, dati compresi. Senza server, senza account, senza cedere nulla."

[homeShowTitle]
other = "Guarda com'è fatta davvero"

[homeShowLead]
