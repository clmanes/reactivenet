[appOpenNote]
other = "L'app viaggia dentro il link: si apre nel tuo browser e resta lì. Niente account, niente installazione, e nessuno dei tuoi dati passa da un server."

[appSource]
other = "Vedi il sorgente"

[appCtaTitle]
other = "È tua da personalizzare"

[appCtaSub]
other = "Un'app è un documento Markdown: aprila, cambiala a mano o chiedi all'assistente di cambiarla per te. Quello che aggiungi resta sul tuo dispositivo."

[homeLocalTitle]
other = "Non ti serve un modello enorme"

[homeLocalLead]
other = "Un'app ReactiveNET è un documento di poche righe, non un programma: per scriverla basta un modello piccolo, di quelli che girano sul tuo computer. Nessuna chiave da comprare, niente che esce dalla macchina, nessuna bolletta a consumo."

[localSmallTitle]
other = "Modelli piccoli, non enormi"

[localSmallText]
other = "Il linguaggio è fatto di direttive, e l'assistente le impara dal server MCP invece di inventarle: un modello da pochi miliardi di parametri costruisce un'app funzionante. I modelli grandi servono per le app più complesse, non per cominciare."

[localDeviceTitle]
other = "Sul tuo computer, non nel cloud"

[localDeviceText]
other = "Con Ollama il modello gira in locale: la richiesta, la conversazione e il documento dell'app restano sulla tua macchina. È l'unica configurazione in cui non c'è nessuna chiave da custodire e niente da cui difendersi."

[localFreeTitle]
other = "Senza costi"

[localFreeText]
other = "La piattaforma è gratuita e i modelli locali sono gratuiti: nessun abbonamento, nessun consumo a token, nessun limite mensile. Se preferisci un fornitore remoto puoi usarlo, ma è una scelta, non un requisito."

[appDownload]
other = "Scarica il documento"

[appImportNote]
other = "Questa app è più grande di quanto un indirizzo possa contenere: si scarica come documento Markdown e si importa dalla galleria. È la stessa app, con un passaggio in più."

[sectionEmpty]
other = "Questa sezione non ha ancora schede pubblicate: le app che la riguardano sono in preparazione. Nel frattempo, un'app che serve a te la puoi far scrivere all'assistente in una frase — è così che nascono anche queste."

